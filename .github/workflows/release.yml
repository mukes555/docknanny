name: Release

# Pushing a version tag builds the DMG and attaches it to a GitHub release,
# then pins the Homebrew tap to it. Without a Developer ID certificate the
# build is ad hoc signed; the cask strips the quarantine so it launches.
on:
  push:
    tags: ["v*"]
  # Releases a tag that is already pushed. GitHub emits no push event when
  # more than three tags arrive in one push, so a tag can land without its
  # release; this also rebuilds a release whose assets went wrong.
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, e.g. v0.4.0 (must exist)"
        required: true
        type: string

# The tag being released: the one pushed, or the one named when run by hand.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

# Actions are pinned to commits, not tags: a tag can be moved to code that
# runs with this repository's token and, in the tap job, with the tap's.
permissions: {}

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Tag, project.yml, and CHANGELOG must agree on the version
        run: tools/check-version.sh "$RELEASE_TAG"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Install tooling
        run: brew install xcodegen

      - name: Build DMG
        run: tools/release.sh

      - name: Release notes from the CHANGELOG section
        run: |
          VERSION="${RELEASE_TAG#v}"
          VERSION="${VERSION%%-*}"
          tools/release-notes.sh "$VERSION" > build/release/RELEASE-NOTES.md
          cat build/release/RELEASE-NOTES.md

      - name: Keep the checksums for the tap job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checksums
          path: build/release/SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # A tag with a suffix (-rc.1, -beta) is a pre-release, so "latest"
          # and the cask's livecheck skip it.
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          body_path: build/release/RELEASE-NOTES.md
          files: |
            build/release/*.dmg
            build/release/SHA256SUMS
          # GitHub appends its compare link and contributors below the notes.
          generate_release_notes: true

  # Pins the tap's cask to this release with its checksum, so `brew upgrade`
  # sees new versions and Homebrew verifies the download. Runs only when a
  # HOMEBREW_TAP_TOKEN secret (a fine-grained PAT with contents: write on
  # mukes555/homebrew-tap) exists; otherwise the cask is rendered by hand,
  # per RELEASING.md.
  update-tap:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The tap is pushed with its own token; this repository's stays read-only here.
    permissions:
      contents: read
    env:
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - name: Checkout DockNanny (for the cask template)
        if: env.HAS_TAP_TOKEN == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Checkout the tap
        if: env.HAS_TAP_TOKEN == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: mukes555/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Fetch the checksums
        if: env.HAS_TAP_TOKEN == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: checksums
          path: checksums

      - name: Render and push the pinned cask
        if: env.HAS_TAP_TOKEN == 'true'
        run: |
          VERSION="${RELEASE_TAG#v}"
          case "$RELEASE_TAG" in *-*) echo "pre-release: tap not updated"; exit 0;; esac
          SHA="$(awk '/\.dmg$/ {print $1}' checksums/SHA256SUMS)"
          [ -n "$SHA" ] || { echo "no dmg checksum in SHA256SUMS" >&2; exit 1; }
          sed -e "s/__VERSION__/$VERSION/" -e "s/__SHA256__/$SHA/" packaging/homebrew/docknanny.rb.tmpl > tap/Casks/docknanny.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/docknanny.rb
          git commit -m "docknanny $VERSION" || echo "cask unchanged"
          git push

      - name: Explain the skipped tap update
        if: env.HAS_TAP_TOKEN != 'true'
        run: echo "HOMEBREW_TAP_TOKEN is not set; render packaging/homebrew/docknanny.rb.tmpl by hand (RELEASING.md)."
