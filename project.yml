name: DockNanny

options:
  bundleIdPrefix: app.docknanny
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.4.1"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES

targets:
  DockNanny:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: DockNanny
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.docknanny
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/DockNanny.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # Ad-hoc signing so the project builds and runs without a paid
        # developer account. Release builds are ad hoc signed in CI too, with
        # the bundle identifier as the designated requirement (tools/release.sh);
        # CODESIGN_IDENTITY and NOTARY_PROFILE switch that to a notarized build.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

  DockNannyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/DockNannyTests
    dependencies:
      - target: DockNanny
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.docknanny.tests

schemes:
  DockNanny:
    build:
      targets:
        DockNanny: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - DockNannyTests
