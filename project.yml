name: macdock

options:
  bundleIdPrefix: app.macdock
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES

targets:
  macdock:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: macdock
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.macdock
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/macdock.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # Ad-hoc signing so the project builds and runs without a paid
        # developer account. Release builds are signed and notarized in CI.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

  macdockTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/macdockTests
    dependencies:
      - target: macdock
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.macdock.tests

schemes:
  macdock:
    build:
      targets:
        macdock: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - macdockTests
