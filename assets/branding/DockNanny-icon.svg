<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="DockNanny">
  <title>DockNanny</title>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F2A16"/>
      <stop offset="1" stop-color="#0C100A"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CFE88B"/>
      <stop offset="1" stop-color="#B3D360"/>
    </linearGradient>
    <clipPath id="squircle"><rect width="1024" height="1024" rx="229"/></clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#ground)"/>
    <rect width="1024" height="1024" fill="url(#gloss)"/>
  </g>
  <rect x="6" y="6" width="1012" height="1012" rx="225" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="10"/>
  <!-- The far display, then the near one over it, each with its dock bar. -->
  <rect x="392" y="236" width="470" height="330" rx="54" fill="#0E1408" stroke="url(#lime)" stroke-width="34"/>
  <rect x="446" y="474" width="362" height="52" rx="26" fill="url(#lime)"/>
  <rect x="162" y="372" width="470" height="330" rx="54" fill="#0E1408" stroke="url(#lime)" stroke-width="34"/>
  <rect x="216" y="610" width="362" height="52" rx="26" fill="url(#lime)"/>
  <!-- The near display's stand. -->
  <rect x="340" y="716" width="114" height="34" rx="17" fill="url(#lime)"/>
  <rect x="256" y="756" width="282" height="34" rx="17" fill="url(#lime)" fill-opacity="0.75"/>
</svg>
